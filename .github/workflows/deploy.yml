name: Deploy to ECS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: production
        type: choice
        options:
          - production
      image_tag:
        description: "Container image tag (commit SHA)"
        required: true
        type: string

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
  TF_DIR: deploy/aws/company-existing
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Terraform Apply
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: ${{ env.TF_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9"

      - name: Terraform init
        run: terraform init

      - name: Terraform apply
        run: |
          terraform apply \
            -var="image_tag=${{ github.event.inputs.image_tag }}" \
            -var="ecr_repository_arn=arn:aws:ecr:${{ env.AWS_REGION }}:${{ secrets.AWS_ACCOUNT_ID }}:repository/${{ env.ECR_REPOSITORY }}" \
            -auto-approve

      - name: Wait for ECS service stable
        run: |
          aws ecs wait services-stable \
            --cluster litellm \
            --services litellm

      - name: Run smoke test
        run: |
          ALB_DNS=$(terraform output -raw alb_dns_name)
          LITELLM_API_KEY=${{ secrets.LITELLM_MASTER_KEY }} \
          ./smoke_test.sh $ALB_DNS
